name: Generate profile cards (contrib-neon, stats-neon)

on:
  schedule:
    - cron: "0 0 * * *" # once a day
  workflow_dispatch: {}
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Generate contribution grid SVGs
        uses: sm-steel/contrib-neon@v1
        with:
          github_user_name: sm-steel
          outputs: |
            dist/contrib-neon.svg?flavor=latte
            dist/contrib-neon-dark.svg?flavor=mocha

      - name: Generate stats card SVGs
        uses: sm-steel/stats-neon@v1
        with:
          github_user_name: sm-steel
          # a personal token so private repos count too (the workflow token sees public only)
          github_token: ${{ secrets.METRICS_TOKEN }}
          outputs: |
            dist/stats.svg?flavor=latte
            dist/stats-dark.svg?flavor=mocha

      - name: Push output to the "output" branch
        uses: crazy-max/ghaction-github-pages@v5
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
