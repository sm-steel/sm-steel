name: Generate stats card

on:
  schedule:
    - cron: "0 0 * * *" # once a day
  workflow_dispatch: {}
  push:
    branches:
      - main

jobs:
  metrics:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          user: sm-steel
          base: "header, repositories"
          plugin_languages: yes
          plugin_languages_limit: 8
          config_output: svg
          config_display: large
          filename: metrics.svg
          committer_branch: output-metrics
          extras_css: |
            :root {
              --color-canvas-default: #1e1e2e !important;
              --color-canvas-subtle: #313244 !important;
              --color-fg-default: #cdd6f4 !important;
              --color-fg-muted: #a6adc8 !important;
              --color-border-default: #45475a !important;
              --color-accent-fg: #cba6f7 !important;
            }
