name: Generate stats card

on:
  schedule:
    - cron: "0 0 * * *" # once a day
  workflow_dispatch: {}
  push:
    branches:
      - main

jobs:
  metrics:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: sm-steel
          base: "header, repositories"
          plugin_languages: yes
          plugin_languages_limit: 8
          config_output: svg
          config_display: large
          filename: metrics.svg
          committer_branch: output-metrics
          extras_css: |
            svg { color: #cdd6f4 !important; }
            h1, h2, h3 { color: #cba6f7 !important; }
            .field svg { fill: #a6adc8 !important; }
            /* languages bar track + remainder segment are hardcoded light colors */
            rect[fill="white"] { fill: #313244 !important; }
            rect[fill="#d1d5da"] { fill: #45475a !important; }
            /* header mini contribution calendar's empty-day cells */
            rect.day[fill="#ebedf0"] { fill: #313244 !important; }
            :root {
              --color-calendar-graph-day-bg: #313244 !important;
              --color-calendar-graph-day-border: rgba(205,214,244,0.08) !important;
              --color-calendar-graph-day-L1-bg: #89b4fa !important;
              --color-calendar-graph-day-L2-bg: #b4befe !important;
              --color-calendar-graph-day-L3-bg: #cba6f7 !important;
              --color-calendar-graph-day-L4-bg: #f5c2e7 !important;
            }
