name: Generate snake animation

on:
  schedule:
    - cron: "0 0 * * *" # once a day
  workflow_dispatch: {}
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Generate contribution snake SVGs
        uses: Platane/snk@v3
        id: snake
        with:
          github_user_name: sm-steel
          outputs: |
            dist/github-contribution-grid-snake.svg?color_snake=4c4f69&color_dots=ccd0da,acb0be,1e66f5,8839ef,ea76cb
            dist/github-contribution-grid-snake-dark.svg?color_snake=cdd6f4&color_dots=313244,585b70,89b4fa,cba6f7,f5c2e7

      - name: Push output to the "output" branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
