name: Generate snake animation

on:
  schedule:
    - cron: "0 0 * * *" # once a day
  workflow_dispatch: {}
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Generate contribution snake SVGs
        uses: Platane/snk@v3
        id: snake
        with:
          github_user_name: sm-steel
          outputs: |
            dist/github-contribution-grid-snake.svg?color_snake=%23fe640b&color_dots=%23ccd0da,%23acb0be,%231e66f5,%238839ef,%23ea76cb
            dist/github-contribution-grid-snake-dark.svg?color_snake=%23fab387&color_dots=%2345475a,%23585b70,%2389b4fa,%23cba6f7,%23f5c2e7

      - name: Push output to the "output" branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
